<!-- @dsCard group="Foundations" viewport="700x240" name="Semantic colors" subtitle="Roles stay; values flip with theme" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:240px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;background:var(--lumia-paper);color:var(--lumia-text)">
  <div style="padding:12px;background:var(--lumia-app-bg)">App</div>
  <div style="padding:12px;background:var(--lumia-selection);color:var(--lumia-on-selection)">Selection</div>
  <div style="padding:12px;background:var(--lumia-primary);color:var(--lumia-on-primary)">Primary</div>
  <div style="padding:12px;background:var(--lumia-success);color:var(--lumia-on-primary)">Success</div>
  <div style="padding:12px;background:var(--lumia-editor);border:1px solid var(--lumia-border)">Editor</div>
  <div style="padding:12px;background:var(--lumia-paper);border:1px solid var(--lumia-border)">Paper</div>
  <div style="padding:12px;background:var(--lumia-controls)">Controls</div>
  <div style="padding:12px;background:var(--lumia-danger);color:var(--lumia-on-primary)">Danger</div>
</div>
