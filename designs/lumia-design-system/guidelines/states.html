<!-- @dsCard group="Patterns" viewport="700x220" name="States" subtitle="Empty, success, disabled and error are explicit" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:220px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px;background:var(--lumia-app-bg)">
  <section class="lumia-panel"><div class="lumia-panel__header"><strong>Empty</strong></div><div class="lumia-panel__body">—<br><small>无 Copy</small></div></section>
  <section class="lumia-panel"><div class="lumia-panel__header"><strong>Success</strong></div><div class="lumia-panel__body" style="color:var(--lumia-success)">READY</div></section>
  <section class="lumia-panel"><div class="lumia-panel__header"><strong>Disabled</strong></div><div class="lumia-panel__body"><button class="lumia-button" disabled>不可用</button></div></section>
  <section class="lumia-panel"><div class="lumia-panel__header"><strong>Error</strong></div><div class="lumia-panel__body" style="color:var(--lumia-danger)">INVALID</div></section>
</div>
