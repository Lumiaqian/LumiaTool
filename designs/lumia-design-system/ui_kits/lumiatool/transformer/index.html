<!-- @startingPoint section="Tool pages" subtitle="Source and result panes with a fixed control rack" viewport="1200x720" -->
<link rel="stylesheet" href="../../../styles.css">
<div style="height:720px;padding:16px;background:var(--lumia-app-bg);color:var(--lumia-text);display:grid;grid-template-columns:1fr 1fr;gap:12px">
<section class="lumia-panel" data-surface="editor"><div class="lumia-panel__header"><strong>输入</strong><span>UTF-8 · Text</span></div><div class="lumia-panel__body"><code>Source content</code></div></section>
<section class="lumia-panel"><div class="lumia-panel__header"><strong>输出</strong><button class="lumia-button">复制</button></div><div class="lumia-panel__body"><code>Converted result</code></div></section>
</div>
