<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LumiaTool UI 全面审查</title>
    <style>
        :root { color-scheme: dark; --ink: #f4ecdf; --muted: #b4a697; --surface: #241f1a; --raised: #29241e; --line: rgba(255,242,225,.14); --accent: #efa968; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #171410; color: var(--ink); font: 14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif; }
        .review { max-width: 1800px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 280px minmax(0,1fr); gap: 24px; }
        .brief { position: sticky; top: 24px; align-self: start; padding: 20px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 25px; line-height: 1.2; }
        .brief p { margin: 12px 0 0; color: var(--muted); }
        .brief h2 { margin: 24px 0 8px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
        .brief ol { margin: 0; padding-left: 20px; color: var(--muted); }
        .brief li + li { margin-top: 8px; }
        .stage { min-width: 0; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tabs button { min-height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--muted); font: inherit; cursor: pointer; }
        .tabs button[aria-selected="true"] { border-color: transparent; background: var(--accent); color: #2b190b; }
        .frame { display: none; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: #000; }
        .frame.is-active { display: block; }
        .frame img { display: block; width: 100%; height: auto; }
        .hotspot { position: absolute; display: block; border-radius: 5px; }
        .desktop .hotspot { transform: scaleX(1); }
        #wide-topbar { left: 0; top: 0; width: 100%; height: 5.5%; }
        #wide-brand { left: 3%; top: 1%; width: 10%; height: 4.5%; }
        #wide-search { left: 63%; top: 1%; width: 12%; height: 4.5%; }
        #wide-shelf { left: 0; top: 5.5%; width: 14.4%; height: 94.5%; }
        #wide-tool-grid { left: .4%; top: 8.3%; width: 8.3%; height: 34%; }
        #wide-workspace { left: 14.4%; top: 5.5%; width: 85.6%; height: 94.5%; }
        #wide-form-rack { left: 14.7%; top: 12.3%; width: 28.5%; height: 72%; }
        #wide-output { left: 43.1%; top: 12.3%; width: 55.8%; height: 72%; }
        #wide-status { left: 14.4%; top: 96.8%; width: 85.6%; height: 3.2%; }
        #compact-topbar { left: 0; top: 0; width: 100%; height: 8.5%; }
        #compact-toolbar { left: 0; top: 8.5%; width: 100%; height: 8.5%; }
        #compact-input { left: 3%; top: 18%; width: 94%; height: 60%; }
        #compact-output { left: 3%; top: 80%; width: 94%; height: 14%; }
        #compact-status { left: 0; top: 95%; width: 100%; height: 5%; }
        @media (max-width: 980px) { .review { grid-template-columns: 1fr; padding: 12px; } .brief { position: static; } }
    </style>
</head>
<body>
    <main class="review">
        <aside class="brief">
            <p class="eyebrow">UI Review · 2026-08-29</p>
            <h1>LumiaTool 工作台</h1>
            <p>目的：让开发者在本地转换、生成与验证任务中快速定位工具、完成输入并读取结果。</p>
            <h2>本轮视角</h2>
            <ol>
                <li>信息层级与任务聚焦</li>
                <li>视觉一致性、密度与层级</li>
                <li>响应式与可访问性交互</li>
                <li>保留项与低优先级细节</li>
            </ol>
            <p>结论只基于实际运行的 Hash 工作台：深色/浅色 1568×953 与浅色 700×600。</p>
        </aside>
        <section class="stage" aria-label="LumiaTool 工作台审查画面">
            <nav class="tabs" aria-label="审查截图">
                <button type="button" aria-selected="true" data-screen="dark">深色 · 宽窗</button>
                <button type="button" aria-selected="false" data-screen="light">浅色 · 宽窗</button>
                <button type="button" aria-selected="false" data-screen="compact">浅色 · 窄窗</button>
            </nav>
            <data-overlay src="./feedback-views.js" controls="on">
                <section class="frame desktop dark is-active" data-screen-label="深色宽窗">
                    <img src="./dark-desktop.webp" alt="深色 LumiaTool Hash 工作台">
                    <i id="wide-topbar" class="hotspot" data-metric-id="wide-topbar"></i><i id="wide-brand" class="hotspot" data-metric-id="wide-brand"></i><i id="wide-search" class="hotspot" data-metric-id="wide-search"></i><i id="wide-shelf" class="hotspot" data-metric-id="wide-shelf"></i><i id="wide-tool-grid" class="hotspot" data-metric-id="wide-tool-grid"></i><i id="wide-workspace" class="hotspot" data-metric-id="wide-workspace"></i><i id="wide-form-rack" class="hotspot" data-metric-id="wide-form-rack"></i><i id="wide-output" class="hotspot" data-metric-id="wide-output"></i><i id="wide-status" class="hotspot" data-metric-id="wide-status"></i>
                </section>
                <section class="frame desktop light" data-screen-label="浅色宽窗">
                    <img src="./light-desktop.webp" alt="浅色 LumiaTool Hash 工作台">
                    <i class="hotspot" style="left:0;top:0;width:100%;height:5.5%" data-metric-id="light-topbar"></i><i class="hotspot" style="left:0;top:5.5%;width:14.4%;height:94.5%" data-metric-id="light-shelf"></i><i class="hotspot" style="left:14.4%;top:5.5%;width:85.6%;height:94.5%" data-metric-id="light-workspace"></i>
                </section>
                <section class="frame compact" data-screen-label="浅色窄窗">
                    <img src="./light-compact.png" alt="窄窗 LumiaTool Hash 工作台">
                    <i id="compact-topbar" class="hotspot" data-metric-id="compact-topbar"></i><i id="compact-toolbar" class="hotspot" data-metric-id="compact-toolbar"></i><i id="compact-input" class="hotspot" data-metric-id="compact-input"></i><i id="compact-output" class="hotspot" data-metric-id="compact-output"></i><i id="compact-status" class="hotspot" data-metric-id="compact-status"></i>
                </section>
            </data-overlay>
        </section>
    </main>
    <script src="./data-overlay.js"></script>
    <script>
        const overlay = document.querySelector("data-overlay");
        const screenForView = {
            "task-focus": "dark",
            "visual-consistency": "light",
            "responsive-accessibility": "compact",
            "working": "dark",
            "small-stuff": "dark",
        };
        const viewForScreen = {
            dark: "task-focus",
            light: "visual-consistency",
            compact: "responsive-accessibility",
        };

        function showScreen(screen, syncView = false) {
            document.querySelectorAll("[data-screen]").forEach(item =>
                item.setAttribute("aria-selected", String(item.dataset.screen === screen))
            );
            document.querySelectorAll(".frame").forEach(frame =>
                frame.classList.toggle("is-active", frame.classList.contains(screen))
            );
            if (syncView && overlay && viewForScreen[screen]) {
                overlay.view = viewForScreen[screen];
            }
            requestAnimationFrame(() => overlay?.measure());
        }

        document.querySelectorAll("[data-screen]").forEach(button =>
            button.addEventListener("click", () => showScreen(button.dataset.screen, true))
        );
        document.querySelectorAll(".frame img").forEach(image =>
            image.addEventListener("load", () => overlay?.measure())
        );
        window.addEventListener("load", () =>
            requestAnimationFrame(() => requestAnimationFrame(() => overlay?.measure()))
        );

        if (overlay?.shadowRoot) {
            new MutationObserver(() => {
                const screen = screenForView[overlay.view];
                const current = document.querySelector("[data-screen][aria-selected=\"true\"]")?.dataset.screen;
                if (screen && screen !== current) {
                    showScreen(screen);
                }
            }).observe(overlay.shadowRoot, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
