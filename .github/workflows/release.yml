name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate-version:
        name: validate-version
        runs-on: ubuntu-22.04
        timeout-minutes: 5

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version

            - name: Match tag and application versions
              run: |
                  node <<'NODE'
                  const fs = require("node:fs");
                  const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
                  const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
                  const cargoText = fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8");
                  const cargoVersion = cargoText.match(/^version\s*=\s*"([^"]+)"/m)?.[1];

                  if (tagVersion !== packageVersion || tagVersion !== cargoVersion) {
                      console.error({ tagVersion, packageVersion, cargoVersion });
                      process.exit(1);
                  }
                  NODE

    build:
        name: build-${{ matrix.asset_suffix }}
        needs: validate-version
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 60
        env:
            NODE_OPTIONS: --max-old-space-size=8192
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: --target aarch64-apple-darwin
                      rust_targets: aarch64-apple-darwin
                      asset_suffix: macos_aarch64
                    - platform: macos-latest
                      args: --target x86_64-apple-darwin
                      rust_targets: x86_64-apple-darwin
                      asset_suffix: macos_x86_64
                    - platform: ubuntu-22.04
                      args: ""
                      rust_targets: x86_64-unknown-linux-gnu
                      asset_suffix: linux
                    - platform: windows-latest
                      args: ""
                      rust_targets: x86_64-pc-windows-msvc
                      asset_suffix: windows

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Rust
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.rust_targets }}

            - name: Cache Rust
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  workspaces: apps/desktop/src-tauri -> target
                  key: ${{ matrix.asset_suffix }}

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes \
                    build-essential \
                    file \
                    libfuse2 \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    rpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate application configuration
              run: pnpm initialize

            - name: Build and create draft release
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
                  NODE_OPTIONS: --max-old-space-size=8192
              with:
                  projectPath: apps/desktop
                  tauriScript: pnpm tauri
                  tagName: ${{ github.ref_name }}
                  releaseName: LumiaTool v__VERSION__
                  generateReleaseNotes: true
                  releaseDraft: true
                  prerelease: false
                  includeUpdaterJson: false
                  args: ${{ matrix.args }}
                  assetNamePattern: lumiatool_${{ matrix.asset_suffix }}.[ext]
