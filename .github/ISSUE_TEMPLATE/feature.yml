name: 功能建议
description: 建议新工具或现有桌面功能改进
title: "[Feature] "
labels:
    - enhancement
body:
    - type: dropdown
      id: area
      attributes:
          label: 建议范围
          options:
              - 新增工具
              - 现有工具
              - 桌面界面
              - 安装与发布
              - 其他
      validations:
          required: true
    - type: textarea
      id: scenario
      attributes:
          label: 使用场景
          description: 请描述当前遇到的问题，不要只填写功能名称。
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: 建议方案
          description: 请说明期望的输入、输出和操作方式。
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: 可选方案
          description: 如果尝试过其他工具或替代方式，可以在这里说明。
    - type: checkboxes
      id: confirmation
      attributes:
          label: 提交确认
          options:
              - label: 我已搜索现有 Issue，确认没有重复建议。
                required: true
