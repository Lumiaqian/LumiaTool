name: 缺陷报告
description: 报告可以稳定复现的桌面端问题
title: "[Bug] "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              感谢反馈。提交前请确认问题可以在当前开发版本复现，并移除输入、日志和截图中的敏感信息。
    - type: input
      id: version
      attributes:
          label: LumiaTool 版本
          description: 可在“关于”窗口查看。
          placeholder: 例如 0.0.1
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: 操作系统
          options:
              - macOS
              - Windows
              - Linux
      validations:
          required: true
    - type: input
      id: system
      attributes:
          label: 系统版本与架构
          placeholder: 例如 macOS 15.6 / Apple Silicon
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: 问题描述
          description: 请说明发生了什么，以及问题影响了哪个工具或界面。
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: 复现步骤
          placeholder: |
              1. 打开……
              2. 输入……
              3. 点击……
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: 预期行为
      validations:
          required: true
    - type: textarea
      id: evidence
      attributes:
          label: 截图或日志
          description: 可以直接拖入图片或日志；请先删除隐私数据、密钥和令牌。
    - type: checkboxes
      id: confirmation
      attributes:
          label: 提交确认
          options:
              - label: 我已搜索现有 Issue，确认没有重复问题。
                required: true
              - label: 我已从截图和日志中移除敏感信息。
                required: true
