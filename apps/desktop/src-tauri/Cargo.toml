[package]
name = "lumiatool"
version = "0.0.1"
description = "Cross-platform desktop developer toolbox"
authors = ["baiy", "lumiaqian"]
license = "MIT"
repository = "https://github.com/Lumiaqian/LumiaTool"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
